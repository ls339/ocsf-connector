[project]
name = "ocsf-connector"
version = "0.1.0"
description = "Okta System Log to OCSF to Amazon Security Lake"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.8",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "boto3>=1.34",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.scripts]
ocsf-connector = "ocsf_connector.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocsf_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
