# Okta System Log eventType -> OCSF class and activity.
#
# Data, not control flow (docs/SPEC.md §3.3). Every value here was checked
# against the OCSF 1.3.0 schema on 2026-09-12: the class uids are the six IAM
# classes that version defines, and each activity_id appears in that class's own
# enum. Anything absent from `events` is not an error -- it degrades to the
# fallback below, keeps the whole source event under `unmapped`, and increments
# unmapped_event_type_total, which is the source-drift alarm.
#
# Seeded from the event types Okta names on its System Log query page. Okta emits
# hundreds more and adds them continuously; that is what the fallback is for.

version: okta-2026.10.12
ocsf_version: "1.3.0"

# Base Event (class_uid 0, category_uid 0) with activity Unknown. OCSF 1.3.0's
# IAM category has no generic member, and Base Event is emittable in its own
# right, so an unrecognized event says exactly that rather than guessing a class.
fallback:
  class_uid: 0
  activity_id: 0

events:
  # --- sessions and authentication (3002 Authentication) -------------------
  user.session.start: {class_uid: 3002, activity_id: 1}     # Logon
  user.authentication.sso: {class_uid: 3002, activity_id: 1}

  # MFA steps, at 6 Preauth rather than 1 Logon. Two reasons, in order.
  #
  # A sign-in already emits user.session.start at activity 1; adding a second
  # activity-1 row for the MFA step inside the same sign-in would inflate every
  # count of logons. Preauth is also simply the better label: 1.3.0 uses Kerberos
  # vocabulary, where preauth is the step that proves identity before the ticket
  # is granted, which is what an MFA challenge is.
  #
  # Not Base Event: an MFA verification *is* authentication, and at 3002 it
  # carries user, src_endpoint and is_mfa as columns, so "MFA verifications for
  # this user" is a query rather than a JSON string in unmapped.
  user.authentication.auth_via_mfa: {class_uid: 3002, activity_id: 6}   # Preauth
  user.authentication.verify: {class_uid: 3002, activity_id: 6}         # Preauth

  # --- user lifecycle (3001 Account Change) --------------------------------
  user.lifecycle.create: {class_uid: 3001, activity_id: 1}      # Create
  user.lifecycle.activate: {class_uid: 3001, activity_id: 2}    # Enable
  user.lifecycle.unsuspend: {class_uid: 3001, activity_id: 2}   # Enable
  user.lifecycle.deactivate: {class_uid: 3001, activity_id: 5}  # Disable
  user.lifecycle.suspend: {class_uid: 3001, activity_id: 9}     # Lock

  # Credentials and factors, from five weeks of real traffic (pet.25). Enabling
  # an MFA factor is a change to the account; *using* one during a sign-in is
  # user.authentication.auth_via_mfa above, at Authentication/6 Preauth. Two
  # different events, and conflating them would make every sign-in look like a
  # factor enrolment.
  user.account.update_password: {class_uid: 3001, activity_id: 3}   # Password Change
  user.account.reset_password: {class_uid: 3001, activity_id: 4}    # Password Reset
  user.mfa.factor.activate: {class_uid: 3001, activity_id: 10}      # MFA Factor Enable
  system.mfa.factor.activate: {class_uid: 3001, activity_id: 10}    # same, system-initiated
  user.account.subscriptions.update: {class_uid: 3001, activity_id: 99}

  # --- app assignment (3005 User Access Management) ------------------------
  # An app assignment is a privilege granted to a user, so privileges carries
  # the app name -- 3005 requires it.
  application.user_membership.add: {class_uid: 3005, activity_id: 1}     # Assign
  application.user_membership.remove: {class_uid: 3005, activity_id: 2}  # Revoke
  # A privilege granted to a *person*. The equivalents that grant privileges to
  # an application are Entity Management below -- 3005 requires a user, and a
  # placeholder standing in for an OAuth client would make a privilege-grant
  # report count apps as people (pet.25).
  user.account.privilege.grant: {class_uid: 3005, activity_id: 1}        # Assign
  application.user_membership.update: {class_uid: 3005, activity_id: 99}

  # --- group membership (3006 Group Management) ----------------------------
  group.user_membership.add: {class_uid: 3006, activity_id: 3}     # Add User
  group.user_membership.remove: {class_uid: 3006, activity_id: 4}  # Remove User

  # --- objects administered in the org (3004 Entity Management) ------------
  # Okta's lifecycle verbs line up with entity_management's enum; the entity is
  # the app, policy or rule named in target[].
  application.lifecycle.create: {class_uid: 3004, activity_id: 1}
  application.lifecycle.update: {class_uid: 3004, activity_id: 3}
  application.lifecycle.delete: {class_uid: 3004, activity_id: 4}
  application.lifecycle.activate: {class_uid: 3004, activity_id: 10}
  application.lifecycle.deactivate: {class_uid: 3004, activity_id: 11}
  application.user_membership.change_username: {class_uid: 3004, activity_id: 3}
  policy.lifecycle.create: {class_uid: 3004, activity_id: 1}
  policy.lifecycle.update: {class_uid: 3004, activity_id: 3}
  policy.lifecycle.delete: {class_uid: 3004, activity_id: 4}
  policy.lifecycle.activate: {class_uid: 3004, activity_id: 10}
  policy.lifecycle.deactivate: {class_uid: 3004, activity_id: 11}
  policy.rule.add: {class_uid: 3004, activity_id: 1}
  policy.rule.update: {class_uid: 3004, activity_id: 3}
  policy.rule.delete: {class_uid: 3004, activity_id: 4}
  policy.rule.activate: {class_uid: 3004, activity_id: 10}
  policy.rule.deactivate: {class_uid: 3004, activity_id: 11}

  # --- more entities a live org turned out to manage (pet.25) ---------------
  # Added from five weeks of real traffic rather than from Okta's documentation
  # of what it *can* emit. Entity Management has the richest verb set of the six
  # IAM classes, which is why most of what an admin does lands here.
  oauth2.as.created: {class_uid: 3004, activity_id: 1}
  app.oauth2.client.lifecycle.create: {class_uid: 3004, activity_id: 1}
  app.oauth2.client.lifecycle.activate: {class_uid: 3004, activity_id: 10}
  app.oauth2.client.lifecycle.update: {class_uid: 3004, activity_id: 3}
  app.oauth2.credentials.lifecycle.create: {class_uid: 3004, activity_id: 1}
  app.oauth2.credentials.lifecycle.activate: {class_uid: 3004, activity_id: 10}
  app.oauth2.credentials.lifecycle.deactivate: {class_uid: 3004, activity_id: 11}
  app.oauth2.credentials.lifecycle.delete: {class_uid: 3004, activity_id: 4}
  # Key rotation changes the entity's keys rather than creating anything.
  app.oauth2.key.rollover: {class_uid: 3004, activity_id: 3}
  app.oauth2.as.key.rollover: {class_uid: 3004, activity_id: 3}
  # Somebody read a client secret. Low volume, high interest, and Entity
  # Management is the only one of the six classes with a Read activity -- so
  # this is queryable rather than buried in Base Event.
  app.oauth2.client.read_client_secret: {class_uid: 3004, activity_id: 2}   # Read
  # Privileges granted to an application, not to a person. See the note at 3005.
  app.oauth2.admin.consent.grant: {class_uid: 3004, activity_id: 3}
  app.oauth2.client.privilege.grant: {class_uid: 3004, activity_id: 3}
  policy.mapping.create: {class_uid: 3004, activity_id: 1}
  directory.mapping.update: {class_uid: 3004, activity_id: 3}
  directory.linked_object.create: {class_uid: 3004, activity_id: 1}
  directory.app_user_profile.bootstrap: {class_uid: 3004, activity_id: 1}
  directory.user_profile.bootstrap: {class_uid: 3004, activity_id: 1}
  application.policy.sign_on.rule.create: {class_uid: 3004, activity_id: 1}
  application.policy.sign_on.update: {class_uid: 3004, activity_id: 3}
  zone.create: {class_uid: 3004, activity_id: 1}
  system.brand.create: {class_uid: 3004, activity_id: 1}
  system.rate_limit.configuration.update: {class_uid: 3004, activity_id: 3}
  security.threat.configuration.update: {class_uid: 3004, activity_id: 3}
  # Devices as entities. Arguable -- a device is not an identity object -- but
  # 3004 is the only class with Enroll, and device enrolment is exactly that.
  device.enrollment.create: {class_uid: 3004, activity_id: 6}    # Enroll
  device.lifecycle.activate: {class_uid: 3004, activity_id: 10}  # Activate
  device.user.add: {class_uid: 3004, activity_id: 3}             # Update

  # --- OAuth token issuance (3002 Authentication) --------------------------
  # Added after a live org showed these dominating real traffic. OCSF 1.3.0's
  # Authentication activities are Kerberos vocabulary; OAuth maps onto them
  # readably, and Authorize Session (3003) does not fit at all -- its activities
  # are Assign Privileges and Assign Groups.
  #
  # A client-credentials grant has no user, and 3002 requires one, so those
  # records carry a placeholder user. Honest, but worth knowing before counting
  # distinct users.
  app.oauth2.token.grant: {class_uid: 3002, activity_id: 4}               # Service Ticket Request
  app.oauth2.token.grant.access_token: {class_uid: 3002, activity_id: 4}
  app.oauth2.token.grant.refresh_token: {class_uid: 3002, activity_id: 5}  # Renew
  app.oauth2.authorize.code: {class_uid: 3002, activity_id: 3}            # Authentication Ticket
  # An ID token is an assertion about who the user is, not a ticket for reaching
  # a service, so none of 3/4/5 describes it -- and activity 1 would double-count
  # the sign-in it belongs to. Other, in Authentication rather than Base Event, so
  # the four events of one OAuth flow stay in one table and can be read together.
  app.oauth2.token.grant.id_token: {class_uid: 3002, activity_id: 99}     # Other

  # --- no IAM home in 1.3.0 -------------------------------------------------
  # These are not identity events, so they are Base Event -- but mapped
  # deliberately to activity 99 Other rather than left out of this file. Left out,
  # each occurrence would register as source drift, and a drift alarm that names
  # five event types every run has no way left to say "Okta emitted something
  # new" (§7). Activity 99 also separates a decision from an accident: the
  # fallback is activity 0 Unknown, so 99 means somebody looked.
  security.request.blocked: {class_uid: 0, activity_id: 99}
  # A policy decision, evaluated during a sign-in but not itself an
  # authentication: nothing was proved and nobody was let in. 1.3.0's IAM
  # category has no member for a policy evaluation.
  policy.evaluate_sign_on: {class_uid: 0, activity_id: 99}
  # Reaching the admin console inside a session that already exists. Not a logon
  # -- the logon was user.session.start -- and not account or entity management.
  user.session.access_admin_app: {class_uid: 0, activity_id: 99}
  # Synchronisation mechanics: the record of a profile being pushed downstream,
  # not a decision about access. Mapped rather than omitted so they stop
  # registering as drift (pet.25).
  application.provision.user.push: {class_uid: 0, activity_id: 99}
  application.provision.user.sync: {class_uid: 0, activity_id: 99}
  application.provision.user.push_profile: {class_uid: 0, activity_id: 99}
  app.user_management.push_new_user_success: {class_uid: 0, activity_id: 99}
  app.app_instance.provision_sync_job.started: {class_uid: 0, activity_id: 99}
  app.app_instance.provision_sync_job.completed: {class_uid: 0, activity_id: 99}
  # Not identity events at all, and no IAM class claims them.
  security.protected_action.attempt: {class_uid: 0, activity_id: 99}
  system.email.delivery: {class_uid: 0, activity_id: 99}
  user.session.context.change: {class_uid: 0, activity_id: 99}
